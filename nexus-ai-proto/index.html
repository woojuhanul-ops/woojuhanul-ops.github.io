<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>넥서스 AI — 준비 중</title>
<style>
  body{margin:0;min-height:100vh;background:#0B0F19;color:#F8FAFC;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:520px;padding:40px 24px}
  svg{width:120px;height:120px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .nxspin{transform-origin:50% 50%;animation:spin 26s linear infinite}
  h1{font-size:27px;letter-spacing:.14em;margin:22px 0 6px}
  .sub{color:#2DD4BF;font-size:15px;letter-spacing:.3em;margin-bottom:20px}
  p{font-size:16.5px;line-height:1.7;color:rgba(248,250,252,.85)}
  a.brandlink{display:inline-block;margin-top:26px;color:#38BDF8;text-decoration:none;border:1px solid rgba(56,189,248,.45);padding:11px 22px;border-radius:999px;font-size:15px;min-height:44px;line-height:22px}
</style>
<style id="nx-pagefix">html,body{overflow-x:clip}body>header{flex-wrap:wrap}header .brandlink{min-width:0}header .brand{min-width:0;overflow:hidden}header .brand b{white-space:nowrap}header .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nx-langwrap{flex:none!important}</style></head>
<body>
  <div class="box">
    <svg viewBox="0 0 100 100" fill="none" aria-label="Nexus Group Logo"><g class="nxspin"><ellipse cx="50" cy="50" rx="38" ry="14" stroke="#38BDF8" stroke-width="2.5" transform="rotate(-30 50 50)"/><ellipse cx="50" cy="50" rx="38" ry="14" stroke="#818CF8" stroke-width="2.5" transform="rotate(30 50 50)"/><ellipse cx="50" cy="50" rx="38" ry="14" stroke="#F8FAFC" stroke-width="1.5" stroke-opacity=".75" transform="rotate(90 50 50)" stroke-dasharray="3 3"/></g><circle cx="50" cy="50" r="4.5" fill="#38BDF8"/><circle cx="50" cy="50" r="2" fill="#F8FAFC"/></svg>
    <h1>넥서스 AI</h1>
    <div class="sub">준비 중</div>
    <p>평생 동반자를 만들고 있습니다.<br>준비가 끝나면 이 자리에서 열립니다.</p>
    <a class="brandlink" href="https://nexus-2e23d.web.app/">넥서스 그룹 홈페이지</a>
  </div>
</body>
</html>
